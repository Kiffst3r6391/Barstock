name: build-windows

on:
  workflow_dispatch:
  push:
    branches: [main, retire-items-and-pricing-updates]

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: "x64"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-build.txt
          pip install pytest
      - name: Run tests
        run: python -m pytest -q
      - name: Build portable ZIP
        run: python build_windows.py --profile bruntsfield
      - name: Run packaged self-test
        shell: pwsh
        run: |
          $exe = "dist\BarStockManagement\BarStockManagement.exe"
          if (!(Test-Path $exe)) { throw "Executable not found: $exe" }
          $proc = Start-Process -FilePath $exe -ArgumentList "--self-test" -Wait -PassThru
          $report = Join-Path $env:TEMP "barstock_self_test.txt"
          if (Test-Path $report) { Get-Content $report }
          if ($proc.ExitCode -ne 0) { throw "Self-test failed with exit code $($proc.ExitCode)" }
      - name: Upload portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: BarStockManagement-Windows-x64
          path: BarStockManagement-Windows-x64.zip
          if-no-files-found: error
